name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-invariants:
    runs-on: ubuntu-latest
    # Every other job waits on this one, so a hang here stalls the whole run. The job takes about
    # 75 seconds; ten minutes is a wide margin that still fails fast when a suite hangs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # BacklogStaleOpen and CitationFreshness both diff against the merge base with
          # origin/main, so they need full history.
          fetch-depth: 0
      - name: Repository invariant checks
        shell: pwsh
        run: ./scripts/ci/check-repo-invariants.ps1

  build-test:
    runs-on: ubuntu-latest
    needs: repo-invariants
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # MinVer needs full history for version derivation
      - name: Verify changelog asset
        # Requires PowerShell 7 (pwsh); available on GitHub-hosted runners
        run: pwsh ./scripts/ci/generate-changelog-json.ps1 -Check
      - name: Detect changed paths the code filter does not exclude
        id: filter
        uses: dorny/paths-filter@v4.0.1
        with:
          # The patterns live in their own file because the local Gate reads them too - see
          # scripts/code-change-filter.common.ps1. Two copies would let CI and the Gate
          # disagree about one branch.
          predicate-quantifier: 'every'
          filters: .github/code-paths-filter.yml
      - name: Skip notice (every changed path excluded)
        if: steps.filter.outputs.code == 'false'
        run: echo "Every changed path matched an exclusion — skipping build, test, and coverage. The patterns are in .github/code-paths-filter.yml." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-dotnet@v4
        if: steps.filter.outputs.code == 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'
      - if: steps.filter.outputs.code == 'true'
        run: dotnet restore
      - if: steps.filter.outputs.code == 'true'
        run: dotnet build --configuration Release --no-restore
      - name: CLI --help smoke test
        if: steps.filter.outputs.code == 'true'
        run: dotnet run --project src/Tools/AHKFlowApp.CLI --no-build --configuration Release -- --help
      - name: CLI hotstring --help smoke test
        if: steps.filter.outputs.code == 'true'
        run: dotnet run --project src/Tools/AHKFlowApp.CLI --no-build --configuration Release -- hotstring --help
      - name: Test with coverage
        if: steps.filter.outputs.code == 'true'
        run: >
          dotnet test --configuration Release --no-build --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --settings coverlet.runsettings
      - name: Merge coverage reports
        if: always() && steps.filter.outputs.code == 'true'
        uses: danielpalme/ReportGenerator-GitHub-Action@5.3.0
        with:
          reports: 'TestResults/**/coverage.cobertura.xml'
          targetdir: 'CoverageReport'
          reporttypes: 'MarkdownSummaryGithub;JsonSummary;HtmlInline_AzurePipelines;Cobertura'
      - name: Append coverage guidance to summary
        if: always() && steps.filter.outputs.code == 'true'
        run: |
          mkdir -p CoverageReport
          python scripts/ci/check-coverage-thresholds.py --github-summary-footer >> CoverageReport/SummaryGithub.md
      - name: Append coverage summary to job summary
        if: always() && steps.filter.outputs.code == 'true'
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish test results
        if: always() && steps.filter.outputs.code == 'true'
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        with:
          files: 'TestResults/**/*.trx'
      - name: Sticky coverage comment
        if: always() && steps.filter.outputs.code == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: CoverageReport/SummaryGithub.md
      - name: Upload coverage artifacts
        if: always() && steps.filter.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            CoverageReport
            TestResults/**/*.trx
          retention-days: 14
      - name: Enforce per-assembly coverage thresholds
        if: always() && steps.filter.outputs.code == 'true'
        run: python scripts/ci/check-coverage-thresholds.py
      - if: steps.filter.outputs.code == 'true'
        run: dotnet format AHKFlowApp.slnx --verify-no-changes

  powershell-suites:
    runs-on: windows-latest
    needs: repo-invariants
    steps:
      - uses: actions/checkout@v4
        with:
          # Tier 3 of the citation check diffs against the merge base with origin/main.
          fetch-depth: 0
      # tests/CoverageInputCompleteness.Tests.ps1 runs `dotnet sln list` and the coverage gate.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The script runs every tests/*.Tests.ps1 as its own process, so one failing suite fails
      # this job and the rest still run. Listing the suites here let fifteen of them fail
      # silently - see backlog/done/066-ci-swallows-powershell-suite-failures-in-worktree-powershell-tests.md.
      - name: Run PowerShell suites
        shell: pwsh
        run: ./scripts/run-powershell-suites.ps1

  codex-skills-hash-parity:
    # Runs on Linux: the bash setup script refuses under Windows Git Bash, and this
    # asserts the bash and PowerShell Codex hash implementations agree (both preinstalled
    # on ubuntu runners).
    runs-on: ubuntu-latest
    needs: repo-invariants
    steps:
      - uses: actions/checkout@v4
      - name: Run Codex skills hash parity test
        shell: pwsh
        run: ./tests/CodexSkillsHashParity.Tests.ps1

  bicep-lint:
    runs-on: ubuntu-latest
    needs: repo-invariants
    steps:
      - uses: actions/checkout@v4
      - name: Lint Bicep
        run: az bicep build --file infra/main.bicep

  # TEMPORARY - backlog 127, Task 1. Nobody has ever run scripts/run-powershell-suites.ps1 on
  # Linux, so no suite outside the invariant five has recorded Linux evidence. This job produces
  # that evidence in one run. It uses the same setup as powershell-suites, so a failure here is
  # about the platform and not about a missing tool. continue-on-error keeps it reporting instead
  # of blocking. Task 1b reads its log, writes the evidence into backlog/127, and deletes this job.
  linux-suite-probe:
    runs-on: ubuntu-latest
    needs: repo-invariants
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run PowerShell suites on Linux
        shell: pwsh
        continue-on-error: true
        run: ./scripts/run-powershell-suites.ps1
