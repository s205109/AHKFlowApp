name: PR-Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One PR-Agent run at a time per pull request. PR-Agent edits its previous
# comment instead of posting a new one, so two runs would overwrite each other.
# Runs queue rather than cancel, so a /review is not killed by a later /improve.
concurrency:
  group: pr-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr_agent:
    # PR-Agent strips a leading slash rather than requiring one, so a plain
    # comment starting with "describe ..." would run /describe and overwrite the
    # pull request body. Only run for an explicit command we want, which also
    # keeps /oc comments meant for the opencode workflow from starting a job.
    if: >
      github.event.sender.type != 'Bot' &&
      (
        (github.event.issue.pull_request && github.event.issue.state == 'open') ||
        (github.event.pull_request && github.event.pull_request.state == 'open')
      ) &&
      contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association
      ) &&
      (
        startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/describe') ||
        startsWith(github.event.comment.body, '/improve') ||
        startsWith(github.event.comment.body, '/ask') ||
        startsWith(github.event.comment.body, '/help')
      )

    runs-on: ubuntu-latest

    # This job cap is a backstop, not the real bound. PR-Agent reports
    # ai_timeout = 120, but that setting is not enforced: it reaches the model
    # call and bounds nothing. Run 31832272275 succeeded with one call that
    # took 8 minutes 2 seconds. A review costs 8 to 15 minutes of model time,
    # so the bound we control is the 20-minute cap on the step below. This
    # value only stops a stuck job from running to GitHub's 6-hour default.
    # Backlog 108 records the evidence.
    timeout-minutes: 45

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      # A step timeout fails the step, so the step below it still runs. A job
      # timeout cancels the whole job and runs nothing further. Keep this cap
      # under the job cap of 45 minutes.
      - name: Run PR-Agent
        timeout-minutes: 20
        # pragent/pr-agent:0.41.1-github_action
        uses: docker://pragent/pr-agent@sha256:ec267eb168375c150d75efc024e2b10e0e2768ad0c000f15fd2378fe63abfe98
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          openrouter__key: ${{ secrets.OPENROUTER_API_KEY }}

      # A failed or cancelled run posts nothing to the pull request, and a
      # reviewer reads that silence as a clean review. Say so on the pull
      # request instead. This step runs only because the step above has its own
      # timeout: a job-level cancel would kill this step too.
      - name: Report an unfinished review
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --body \
            "PR-Agent did not finish, so this run posted no findings. Treat this pull request as unreviewed and run \`/review\` again. The run either failed or passed its 20-minute cap. Log: $RUN_URL"
