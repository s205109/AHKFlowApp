# One source of truth for "did this branch change any path this file does not exclude?".
#
# That is the real question, and it is wider than "did anything compile?". A changed path counts
# as code unless a pattern below excludes it, so ci.yml and Directory.Packages.props both count
# even though neither compiles. The deny-list direction is the whole design.
#
# Read by two callers:
#   - .github/workflows/ci.yml, through dorny/paths-filter's `filters` input, which accepts a
#     path to a file as well as inline YAML.
#   - scripts/code-change-filter.common.ps1, which the local Gate uses, so both readers apply
#     the same exclusions to the same diff. The Gate adds the coverage-tooling key below, which
#     CI does not read, so the Gate can be stricter on those paths and never looser.
#
# Every entry is negative, and the action runs them with predicate-quantifier: 'every'. A
# changed file counts as code only when no pattern here excludes it. `code` is true when at
# least one changed file survives. Adding a pattern can only make `code` false more often.
#
# This is a deny-list on purpose. A path nobody listed counts as code, so a forgotten pattern
# costs a few minutes of CI time. An allow-list would silently skip real coverage instead.
#
# scripts/*.ps1 and scripts/**/*.ps1 overlap deliberately. The overlap removes any dependence
# on whether ** matches zero directory segments in the action's glob engine.
#
# tests/*.ps1 is one level only. The PowerShell suites sit directly in tests/, while
# tests/AHKFlowApp.*.Tests/ holds compiled C# projects that must keep counting as code.
#
# scripts/ci/check-coverage-thresholds.py is not excluded. It is .py, so changing the coverage
# gate still re-runs the coverage gate.
#
# tests/*.json is one level only, like tests/*.ps1 above it. tests/powershell-suites.json is the
# suite manifest, which no .NET project reads. A .json file inside tests/AHKFlowApp.*.Tests/ is a
# build input and still counts as code.
#
# .githooks, .agents, .github/skills, plugins and .codex are excluded by folder, not by file kind.
# They hold git hooks, agent skills, skill links, the Codex plugin, and Codex hooks. None of it
# reaches a .NET build. A compiled file placed in one of those folders would skip the .NET checks,
# which is the price of a matcher with four shapes - see the 074 spec, section 4.1.
#
# **/*.toml matches .pr_agent.toml, the only TOML file in the repository. The powershell-suites job
# checks that file itself, in tests/PrAgentConfiguration.Tests.ps1.
#
# .github/workflows/** is deliberately absent. ci.yml defines the .NET steps, so a workflow change
# must run them. The filter cannot keep ci.yml as code while excluding its neighbours, so every
# workflow file stays code. Same for .github/code-paths-filter.yml itself.
code:
  - '!**/*.md'
  - '!docs/**'
  - '!.claude/**'
  - '!scripts/*.ps1'
  - '!scripts/**/*.ps1'
  - '!tests/*.ps1'
  - '!tests/*.json'
  - '!.githooks/**'
  - '!.agents/**'
  - '!.github/skills/**'
  - '!plugins/**'
  - '!.codex/**'
  - '!**/*.toml'

# Scripts the local coverage run itself executes. The Gate treats a change to any of these as a
# code change even though the patterns above exclude it, because a defect in one of them makes
# the coverage step fail and the Gate is the only thing that would catch it.
#
# CI does not read this key, and that is correct rather than a gap: CI never runs
# run-coverage.ps1. Its coverage step is a plain `dotnet test` in ci.yml, so a change to these
# files cannot affect it. scripts/ci/check-coverage-thresholds.py, which CI does run, is a .py
# file that no pattern above excludes, so it already counts as code for both readers.
#
# The list is both entry points, plus the whole dot-source graph under them. Not just what an
# entry point loads directly: a file that a common script dot-sources is loaded by the run just as
# surely, so a change to it must select the coverage slice too. And not just what run-coverage.ps1
# loads: test-fast.ps1 is the process the Gate starts, and it loads two modules run-coverage.ps1
# never sees.
#
# run-powershell-suites.ps1 is deliberately absent. test-fast.ps1 starts it as a child process in
# PowerShell mode, which is a different slice, so a change to it cannot affect the coverage run.
#
# tests/CoverageSliceSkip.Tests.ps1 derives this set by reading the dot-source statements out of
# both entry points, so a new dot-source with no entry here fails that suite.
coverage-tooling:
  - 'scripts/run-coverage.ps1'
  - 'scripts/test-fast.ps1'
  - 'scripts/Common.ps1'
  - 'scripts/coverage-inputs.common.ps1'
  - 'scripts/test-run-lock.common.ps1'
  - 'scripts/test-sql-container.common.ps1'
  - 'scripts/code-change-filter.common.ps1'
  - 'scripts/progress.common.ps1'
  - 'scripts/test-results.common.ps1'
  - 'scripts/worktree-docker.common.ps1'
  - 'scripts/worktree-git.common.ps1'
