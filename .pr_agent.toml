[config]
restricted_mode = true
model = "openrouter/pareto-code"
fallback_models = ["openrouter/tencent/hy3"]

# PR-Agent 0.45.0 registers Pareto's 2,000,000-token context window, but not
# Hy3's. OpenRouter reports 262,144 tokens for Hy3, so use that fallback limit.
custom_model_max_tokens = 262144

# Pack at most 64,000 input tokens. This stays below both model limits and
# leaves room for the separate 16,000-token completion cap.
max_model_tokens = 64000

# A recognized timeout moves straight to the fallback model instead of paying
# for the same model twice.
retry_same_model_on_timeout = false

# Show which model answered, and what the run cost.
output_run_details = true
output_run_cost = true

# Update an existing inline suggestion instead of posting a second copy.
persistent_inline_comments = true

# Reserve the completion budget. The selected models keep their own defaults
# for reasoning effort and provider routing.
[openrouter]
max_tokens = 16000

[pr_reviewer]
require_security_review = true
require_tests_review = true
require_estimate_effort_to_review = false
require_risk_assessment = true
require_merge_recommendation = true
require_priority_files = true

# 0.45.0 already defaults this to true. Set it anyway, so the policy cannot
# drift with an upstream default.
persistent_finding_state = true

# This number reaches the model prompt, and it also decides when PR-Agent may
# resolve an earlier finding. It does not truncate the published list: nothing
# in 0.45.0 trims key_issues_to_review before rendering. The instructions below
# repeat the limit for that reason. Five is a request to the model, not a cap
# the tool enforces, so the live review has to count what actually arrives.
num_max_findings = 5
persistent_comment = true

extra_instructions = '''
Focus on:
- correctness
- regressions
- security
- concurrency
- error handling
- maintainability
- missing tests

Report only defects introduced or exposed by this pull request.
For every finding, state the concrete failure path and the supplied evidence that proves it.
Treat unchanged code outside the supplied context as unknown.
Return no finding when its evidence is incomplete.
Report at most 5 findings, ordered by severity.
'''

[pr_code_suggestions]
commitable_code_suggestions = false

# Keep the summary table, and also publish a suggestion scoring 8 or higher as
# a persistent GitHub inline comment.
dual_publishing_score_threshold = 8

# /improve reads its own extra_instructions, not the reviewer's. It writes
# code onto the diff, so it must not propose new files or broad rewrites.
extra_instructions = '''
Suggest only small, local code changes inside the diff.
Focus on:
- correctness
- regressions
- security
- concurrency
- error handling

Each suggestion must apply to changed lines only.
Do not suggest new files, new tests, or refactors that span files.
Do not invent issues.
'''
