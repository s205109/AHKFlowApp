[config]
restricted_mode = true
model = "openrouter/deepseek/deepseek-v4-flash-0731"
fallback_models = ["openrouter/tencent/hy3"]

# PR-Agent only knows the context size of models in its own built-in table, and
# these are not in it. Without custom_model_max_tokens it raises before the
# first call. One value covers both models, so use the smaller of the two:
# deepseek-v4-flash accepts 1,048,576 tokens, tencent/hy3 accepts 262,144.
custom_model_max_tokens = 262144

# The real cap on how much diff we send. PR-Agent defaults this to 32000, which
# would silently truncate a large pull request. Raise it, but stay well under
# the model limit: quality drops on very long input, and every token is billed.
max_model_tokens = 64000

[pr_reviewer]
require_security_review = true
require_tests_review = true
require_estimate_effort_to_review = false
num_max_findings = 5
persistent_comment = true

extra_instructions = '''
Focus on:
- correctness
- regressions
- security
- concurrency
- error handling
- maintainability
- missing tests

Only report actionable findings.
Do not invent issues.
'''

[pr_code_suggestions]
commitable_code_suggestions = false

# /improve reads its own extra_instructions, not the reviewer's. It writes
# code onto the diff, so it must not propose new files or broad rewrites.
extra_instructions = '''
Suggest only small, local code changes inside the diff.
Focus on:
- correctness
- regressions
- security
- concurrency
- error handling

Each suggestion must apply to changed lines only.
Do not suggest new files, new tests, or refactors that span files.
Do not invent issues.
'''
